services:
  - type: web
    name: ecommerce-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RENDER_DATABASE_HOST
        fromDatabase:
          name: ecommerce-db
          property: host
      - key: RENDER_DATABASE_PORT
        fromDatabase:
          name: ecommerce-db
          property: port
      - key: RENDER_DATABASE_NAME
        fromDatabase:
          name: ecommerce-db
          property: database
      - key: RENDER_DATABASE_USER
        fromDatabase:
          name: ecommerce-db
          property: user
      - key: RENDER_DATABASE_PASSWORD
        fromDatabase:
          name: ecommerce-db
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce_user
