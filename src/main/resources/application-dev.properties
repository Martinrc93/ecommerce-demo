spring.datasource.url=jdbc:postgresql://localhost:5433/DB_ecommerce
spring.datasource.username=user
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ejecutar data.sql siempre al arrancar
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

logging.level.root=INFO
logging.level.com.demo.ecommerce=DEBUG

jwt.secret=11111111111111111111111111111111111111111111111111111111111111111111111111
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=1800000

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.security.cookie.secure=false
app.security.cookie.domain=
