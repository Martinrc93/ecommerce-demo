spring.application.name=ecommerce

server.address=0.0.0.0
server.port=${PORT:10000}

spring.datasource.url=jdbc:postgresql://${RENDER_DATABASE_HOST}:${RENDER_DATABASE_PORT}/${RENDER_DATABASE_NAME}
spring.datasource.username=${RENDER_DATABASE_USER}
spring.datasource.password=${RENDER_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.demo.ecommerce=INFO

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:1800000}

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.security.cookie.secure=true
app.security.cookie.domain=${COOKIE_DOMAIN:}
